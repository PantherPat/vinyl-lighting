<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinyl Lighting — Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>📀 Catalog Admin</h1>
      <nav class="top-nav">
        <a href="index.html">Voice Search</a>
      </nav>
    </header>

    <div class="card">
      <form id="record-form" class="record-form">
        <input type="hidden" id="record-id" />

        <div>
          <label for="artist">Artist</label>
          <input type="text" id="artist" required />
        </div>
        <div>
          <label for="title">Title</label>
          <input type="text" id="title" required />
        </div>

        <div>
          <label for="genre">Genre</label>
          <input type="text" id="genre" required />
        </div>
        <div>
          <label for="subgenres">Subgenres (comma-separated)</label>
          <input type="text" id="subgenres" placeholder="e.g. deep house, garage" />
        </div>
        <div>
          <label for="label">Record Label</label>
          <input type="text" id="label" placeholder="e.g. Defected, Warp" />
        </div>
        <div>
          <label for="release_year">Release Year</label>
          <input type="number" id="release_year" placeholder="e.g. 1994" min="1900" max="2099" />
        </div>

        <div>
          <label for="led_index">LED Index</label>
          <select id="led_index" required></select>
        </div>
        <div>
          <label for="shelf_position">Shelf Position</label>
          <input type="text" id="shelf_position" placeholder="e.g. Shelf A, slot 12" />
        </div>

        <div class="form-error" id="form-error"></div>

        <div class="form-actions">
          <button type="submit" class="primary" id="submit-btn">Add Record</button>
          <button type="button" class="secondary" id="cancel-edit" style="display:none;">Cancel</button>
        </div>
      </form>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>LED</th>
            <th>Artist</th>
            <th>Title</th>
            <th>Genre</th>
            <th>Subgenres</th>
            <th>Label</th>
            <th>Year</th>
            <th>Shelf</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="record-table-body"></tbody>
      </table>
      <p id="empty-note" class="empty-note" style="display:none;">No records yet — add your first one above.</p>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
